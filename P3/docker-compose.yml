version: "3.3"

services:
  redis:
    image: redis
    ports:
      - "6379:6379"
  nginx:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/tmp/nginx.conf
    ports:
      - 8080:8080
    depends_on:
      - auth_api
      - library_api

  auth_api:
    build: 
      network: host
      context: ./auth-service
    command: python3 -m app
    ports:
      - "5050:5050"
    volumes:
      - ./:/app
    depends_on:
      - mongo

  library_api:
    build: 
      network: host
      context: ./library-service
    command: python3 -m app
    ports:
      - "5051:5051"
    volumes:
      - ./:/app
    depends_on:
      - mongo

  mongo:
    image: mongo
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: alumnodb
      MONGO_INITDB_ROOT_PASSWORD: "1234"
      MONGO_INITDB_DATABASE: si1
    build:
      network: host
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db
      - configdb:/data/configdb


volumes:
  db:
  configdb: