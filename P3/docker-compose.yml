version: "3.3"

services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
  nginx:
    image: nginx
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:8080
    depends_on:
      - auth_api
      - library_api

  auth_api:
    build: 
      network: host
      context: ./auth-service
    command: hypercorn --bind 0.0.0.0:5050 app:app
    ports:
      - "5050:5050"
    volumes:
      - ./auth-service:/app
    depends_on:
      - mongo

  library_api:
    build: 
      network: host
      context: ./library-service
    command: hypercorn --bind 0.0.0.0:5051 app:app
    ports:
      - "5051:5051"
    volumes:
      - ./library-service:/app
    depends_on:
      - mongo

  mongo:
    image: mongo
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: alumnodb
      MONGO_INITDB_ROOT_PASSWORD: "1234"
      MONGO_INITDB_DATABASE: si1
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db
      - configdb:/data/configdb


volumes:
  db:
  configdb:
  redis_data: